name: Multi-Arch Build and Promote

on:
  push:
    paths: ['multiarch-build-engine/**']
    tags: ["v*.*.*"]
  workflow_dispatch:

env:
  REGISTRY: myrepo.jfrog.io
  DEV_REPO: docker-dev-local
  PROD_REPO: docker-prod-local
  IMAGE_NAME: app
  BUILD_NAME: app-multiarch-build

jobs:
  build-digests:
    name: Build & Push Digest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Platform Variable
        run: |
          PLATFORM=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> $GITHUB_ENV

      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_URL: ${{ secrets.JF_URL }}
        with:
          oidc-provider-name: ${{ secrets.OIDC_PROVIDER_NAME }}

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ steps.setup-jfrog-cli.outputs.oidc-user }}
          password: ${{ steps.setup-jfrog-cli.outputs.oidc-token }}

      - name: Set up QEMU & Buildx
        uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build and Push (Digest Only)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./multiarch-build-engine/src
          platforms: ${{ matrix.platform }}
          outputs: >-
            type=image,
            name=${{ env.REGISTRY }}/${{ env.DEV_REPO }}/${{ env.IMAGE_NAME }},
            push-by-digest=true,
            name-canonical=true,
            push=true

      - name: Export Digest
        run: |
          mkdir -p /tmp/digests
          DIGEST="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          retention-days: 1

  merge-and-register:
    name: Merge Manifests & Register Build Info
    runs-on: ubuntu-latest
    needs: build-digests
    outputs:
      canonical_tag: ${{ steps.set-tags.outputs.canonical }}
    
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_URL: ${{ secrets.JF_URL }}
        with:
          oidc-provider-name: ${{ secrets.OIDC_PROVIDER_NAME }}

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ steps.setup-jfrog-cli.outputs.oidc-user }}
          password: ${{ steps.setup-jfrog-cli.outputs.oidc-token }}

      - uses: docker/setup-buildx-action@v3

      - name: Compute Tags
        id: set-tags
        run: |
          CANONICAL="build-${{ github.run_number }}"
          echo "canonical=$CANONICAL" >> $GITHUB_OUTPUT
          echo "IMAGE_BASE=${{ env.REGISTRY }}/${{ env.DEV_REPO }}/${{ env.IMAGE_NAME }}" >> $GITHUB_ENV

      - name: Create Multi-Arch Manifest List
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t ${{ env.IMAGE_BASE }}:${{ steps.set-tags.outputs.canonical }} \
            $(printf '${{ env.IMAGE_BASE }}@sha256:%s ' *)

      - name: Get Manifest Digest
        id: manifest
        run: |
          DIGEST=$(docker buildx imagetools inspect --format '{{json .Manifest}}' ${{ env.IMAGE_BASE }}:${{ steps.set-tags.outputs.canonical }} | jq -r '.digest')
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT

      - name: Register Build Info
        run: |
          cat > image-info.json <<INFOEOF
          {
            "image.name": "${{ env.IMAGE_BASE }}:${{ steps.set-tags.outputs.canonical }}",
            "containerimage.digest": "${{ steps.manifest.outputs.digest }}"
          }
          INFOEOF
          jf rt build-docker-create ${{ env.DEV_REPO }} --image-file image-info.json --build-name ${{ env.BUILD_NAME }} --build-number ${{ github.run_number }}
          jf rt build-publish ${{ env.BUILD_NAME }} ${{ github.run_number }}
